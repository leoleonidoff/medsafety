services:
  medsafety:
    build: .
    image: medsafety:latest
    container_name: medsafety
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8004/api/health | grep '\"ok\": true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
